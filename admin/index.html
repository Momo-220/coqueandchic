<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Coque & Chic Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="login-page">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="../images/coquelogo.png?v=3" alt="Coque & Chic" style="max-height: 120px; width: auto; display: block; margin: 0 auto 1rem;">
      </div>
      <form class="login-form" id="loginForm">
        <input type="text" name="user" placeholder="Identifiant" required>
        <div style="position: relative; width: 100%;">
          <input type="password" name="pass" id="passInput" placeholder="Mot de passe" required style="width: 100%; padding-right: 2.5rem; margin-bottom: 0;">
          <button type="button" id="togglePassBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; color: var(--gris);">👁️</button>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Se connecter</button>
      </form>
    </div>
  </div>

  <script type="module" src="../js/auth.js?v=2"></script>
</body>
</html>
