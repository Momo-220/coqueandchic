<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Coque & Chic Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .messages-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
    .message-list { background: white; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); max-height: 70vh; overflow-y: auto; }
    .message-item { padding: 1rem; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: var(--transition-fast); }
    .message-item:hover, .message-item.active { background: var(--rose-blush); }
    .message-item.unread { background: linear-gradient(90deg, var(--rose-blush), transparent); }
    .message-item .from { font-weight: 600; }
    .message-item .date { font-size: 0.8rem; color: var(--gris); }
    .message-item .preview { color: var(--gris-fonce); font-size: 0.9rem; margin-top: 0.3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .message-detail { background: white; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: var(--space-md); max-height: 70vh; overflow-y: auto; }
    .reply-box { margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid #f5f5f5; }
    .reply-box textarea { width: 100%; min-height: 100px; padding: 0.75rem; border: 2px solid var(--rose-soft); border-radius: var(--radius-sm); font-family: inherit; resize: vertical; }
    .reply-box textarea:focus { outline: none; border-color: var(--rose-primary); }
    @media (max-width: 768px) { .messages-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1rem 0;">
        <img src="../images/coquelogo.png?v=3" alt="Coque & Chic" style="max-height: 80px; width: auto;">
      </div>
      <ul class="admin-nav">
        <li><a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Tableau de bord</a></li>
        <li><a href="products.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg> Produits</a></li>
        <li><a href="orders.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z"/></svg> Commandes</a></li>
        <li><a href="messages.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Messages</a></li>
        <li><a href="settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Paramètres & Profil</a></li>
        <li><a href="../index.html" target="_blank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg> Voir le site</a></li>
        <li><a href="#" id="logoutBtn" style="color: #dc2626;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Déconnexion</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Messages clients</h1>
      </div>

      <div class="messages-layout">
        <div class="message-list" id="messageList"></div>
        <div class="message-detail" id="messageDetail">
          <p style="text-align:center; color: var(--gris); padding: var(--space-xl);">Sélectionnez un message pour le lire</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '../js/api.js';
    import { auth } from '../js/auth.js';
    if (!auth.check()) window.location.href = '/admin/index.html';

    const list = document.getElementById('messageList');
    const detail = document.getElementById('messageDetail');
    let currentId = null;

    async function render() {
      const messages = await api.fetchMessages();
      list.innerHTML = '';
      if (messages.length === 0) {
        list.innerHTML = '<p style="padding:2rem; text-align:center; color: var(--gris);">Aucun message</p>';
        return;
      }
      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = `message-item ${!m.read ? 'unread' : ''} ${currentId === m.id ? 'active' : ''}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="from">${m.read ? '' : '🔵 '}${m.from}</span>
            <span class="date">${m.date}</span>
          </div>
          <div class="preview">${m.text}</div>
        `;
        div.onclick = () => {
          currentId = m.id;
          api.markRead(m.id);
          render();
          showDetail(m);
        };
        list.appendChild(div);
      });
    }

    function showDetail(m) {
      detail.innerHTML = `
        <div style="border-bottom: 1px solid #f5f5f5; padding-bottom: var(--space-sm); margin-bottom: var(--space-sm);">
          <h3 style="font-family: var(--font-serif);">${m.from}</h3>
          <p style="color: var(--gris); font-size: 0.9rem;">${m.date}</p>
        </div>
        <p style="line-height: 1.7; color: var(--gris-fonce);">${m.text}</p>
        <div class="reply-box">
          <p style="font-weight: 600; margin-bottom: 0.5rem;">💬 Répondre via WhatsApp :</p>
          <textarea id="replyText" placeholder="Tapez votre réponse ici..."></textarea>
          <button class="btn btn-primary" id="sendReply" style="margin-top: 0.5rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24z"/></svg>
            Envoyer sur WhatsApp
          </button>
        </div>
      `;
      document.getElementById('sendReply').onclick = () => {
        const reply = document.getElementById('replyText').value.trim();
        if (!reply) return;
        const msg = `Bonjour ${m.from},\n\n${reply}\n\n— L'équipe Coque & Chic 💕`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      };
    }

    document.getElementById('logoutBtn').onclick = (e) => { e.preventDefault(); auth.logout(); };
    render();
  </script>
</body>
</html>
