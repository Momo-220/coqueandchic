<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ========== SEO PRIMARY ========== -->
  <title>Contact — Coque &amp; Chic | Abidjan, Côte d'Ivoire</title>
  <meta name="description" content="Contactez Coque &amp; Chic pour toute question sur vos commandes, coques de téléphone et accessoires. Réponse rapide par WhatsApp ou formulaire. Basé à Abidjan.">
  <meta name="keywords" content="contact Coque Chic Abidjan, service client coques téléphone Abidjan, commander coque WhatsApp Abidjan">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.coqueandchic.shop/contact.html">
  <link rel="icon" href="images/favicon.png" type="image/png">

  <!-- ========== OPEN GRAPH ========== -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact — Coque &amp; Chic Abidjan">
  <meta property="og:description" content="Contactez-nous pour vos commandes de coques &amp; accessoires. Réponse rapide via WhatsApp.">
  <meta property="og:url" content="https://www.coqueandchic.shop/contact.html">
  <meta property="og:image" content="https://www.coqueandchic.shop/images/coquelogo.png">
  <meta property="og:locale" content="fr_FR">

  <!-- ========== JSON-LD LocalBusiness ========== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Coque &amp; Chic",
    "url": "https://www.coqueandchic.shop",
    "image": "https://www.coqueandchic.shop/images/coquelogo.png",
    "description": "Boutique de coques de téléphone et accessoires tendance à Abidjan, Côte d'Ivoire.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Abidjan",
      "addressCountry": "CI"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "availableLanguage": "French"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); padding: var(--space-lg) 0; }
    .contact-form { display: flex; flex-direction: column; gap: var(--space-sm); }
    .contact-form input, .contact-form textarea { width: 100%; padding: 0.9rem 1.2rem; border-radius: var(--radius-sm); border: 2px solid var(--rose-soft); font-family: inherit; font-size: 1rem; transition: var(--transition-base); }
    .contact-form input:focus, .contact-form textarea:focus { outline: none; border-color: var(--rose-primary); }
    .contact-form textarea { min-height: 150px; resize: vertical; }
    .contact-info { background: var(--blanc); padding: var(--space-md); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); }
    .contact-info li { list-style: none; padding: 0.8rem 0; display: flex; align-items: center; gap: 0.8rem; color: var(--gris-fonce); }
    @media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="site-header" id="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="images/coquelogo.png?v=3" alt="Coque & Chic" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="/" class="nav-link">Accueil</a>
        <a href="/boutique" class="nav-link">Boutique</a>
        <a href="/contact" class="nav-link active">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/panier" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span class="badge" id="cartCount" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-header" style="padding-top: var(--space-lg);">
      <h1 class="section-title">Contactez-nous</h1>
      <p class="section-subtitle">Une question ? On vous répond vite 💕</p>
    </div>
    <div class="contact-grid">
      <form class="contact-form" id="contactForm">
        <input type="text" name="name" placeholder="Votre nom" required>
        <input type="tel" name="phone" placeholder="Votre numéro WhatsApp" required>
        <input type="text" name="subject" placeholder="Sujet" required>
        <textarea name="message" placeholder="Votre message..." required></textarea>
        <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Envoyer le message</button>
      </form>
      <aside class="contact-info">
        <h3 style="font-family: var(--font-serif); margin-bottom: var(--space-sm);">Coque & Chic</h3>
        <ul>
          <li>📞 <a id="ownerPhoneLink" href="#" style="color: var(--rose-deep);">Chargement...</a></li>
          <li>📍 Abidjan, Côte d'Ivoire</li>
          <li>🕘 Lundi - Samedi : 9h-18h</li>
          <li>💬 WhatsApp : réponse rapide 7j/7</li>
        </ul>
        <a id="waContactBtn" href="#" class="btn btn-outline" style="width:100%; margin-top: var(--space-md);" target="_blank">
          Discuter sur WhatsApp
        </a>
      </aside>
    </div>
  </main>

  <a href="https://wa.me/2250768613328" class="whatsapp-float" target="_blank"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 0 0 1.51 5.26l-.999 3.648 3.978-.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg></a>
  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { api } from './js/api.js';
    import { toast, updateBadge } from './js/cart.js';

    // Charger le numéro de téléphone depuis les settings
    api.fetchSettings().then(settings => {
      const phone = settings.ownerPhone || '+225 07 68 61 33 28';
      const phoneClean = phone.replace(/\D/g, '');
      const phoneLink = document.getElementById('ownerPhoneLink');
      const waBtn = document.getElementById('waContactBtn');
      if (phoneLink) { phoneLink.href = `tel:+${phoneClean}`; phoneLink.textContent = phone; }
      if (waBtn) waBtn.href = `https://wa.me/${phoneClean}`;
      const waFloat = document.querySelector('.whatsapp-float');
      if (waFloat) waFloat.href = `https://wa.me/${phoneClean}`;
    });

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Envoi en cours...'; }
      const data = Object.fromEntries(new FormData(e.target));
      api.addMessage({
        from: data.name,
        phone: data.phone,
        text: `[${data.subject}] ${data.message}`,
        subject: data.subject
      });
      toast('✨ Message envoyé ! Nous vous répondrons vite.', 'success');
      e.target.reset();
      if (btn) { btn.disabled = false; btn.textContent = 'Envoyer le message'; }
    });
    updateBadge();
  </script>
</body>
</html>
