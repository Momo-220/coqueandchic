<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <header class="site-header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/coquelogo.png?v=3" alt="Coque & Chic" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">

      <nav class="main-nav" id="mainNav">

      </nav>
      <div class="header-actions">
        <a href="#" class="icon-btn" aria-label="Rechercher"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="#" class="icon-btn" aria-label="Favoris" id="favBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg><span class="badge" id="favCount" style="display:none">0</span></a>

      </div>
    </div>
  </header>

  <section class="section" style="padding-top: var(--space-lg);">
    <div class="container">
      <div class="section-header reveal">
        <h1 class="section-title">Notre boutique</h1>
        <p class="section-subtitle">Trouvez votre coup de cœur</p>
      </div>

      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Rechercher un produit...">
      </div>

      <div class="filters" id="filters">
        <button class="filter-chip active" data-cat="">Tout</button>
        <button class="filter-chip" data-cat="coques">Coques téléphone</button>
        <button class="filter-chip" data-cat="accessoires">Accessoires</button>
      </div>

      <div class="product-grid" id="productsGrid"></div>
      <div id="noResults" style="text-align:center; padding: var(--space-xl); color: var(--gris-fonce); display:none;">
        <p style="font-size:1.2rem;">😕 Aucun produit ne correspond à votre recherche.</p>
      </div>
    </div>
  </section>
